name: Build release ZIP

on:
  push:
    tags:
      - 'v*'

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.check.outputs.commit }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag, version and branch
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash .github/scripts/check-release.sh "$TAG"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run coding standards
        run: composer lint

      - name: Run tests
        run: composer test

  build:
    name: Build ZIP
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      COMMIT: ${{ needs.verify.outputs.commit }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - name: Build ZIP and checksum
        run: bash .github/scripts/build-release-zip.sh "$TAG" "$COMMIT"

      # No build provenance attestation (actions/attest-build-provenance) here: artifact
      # attestations need a public repository or GitHub Enterprise Cloud.
      - name: Write provenance file
        run: |
          checksum="$(cut -d' ' -f1 "dist/mac-members-${TAG}.zip.sha256")"
          built_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          cat > "dist/mac-members-${TAG}.provenance.json" <<EOF
          {
            "tag": "${TAG}",
            "commit": "${COMMIT}",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "built_at_utc": "${built_at}",
            "zip_file": "mac-members-${TAG}.zip",
            "sha256": "${checksum}"
          }
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      COMMIT: ${{ needs.verify.outputs.commit }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist

      - name: Check checksum and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum --check "mac-members-${TAG}.zip.sha256")
          tag_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${TAG}" --jq .sha)"
          if [[ "$tag_commit" != "$COMMIT" ]]; then
            echo "::error::${TAG} points to ${tag_commit}, not to the verified commit ${COMMIT}."
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "" \
            "dist/mac-members-${TAG}.zip" \
            "dist/mac-members-${TAG}.zip.sha256" \
            "dist/mac-members-${TAG}.provenance.json"
